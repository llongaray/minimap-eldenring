name: Windows preview build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests and static analysis
        shell: pwsh
        run: |
          go test ./...
          go vet ./...
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Locate Go binary for the MSYS2 build shell
        shell: pwsh
        run: |
          $go = (Get-Command go.exe).Source
          if (-not (Test-Path -LiteralPath $go)) { throw 'Go nao encontrado no runner' }
          "ARAY_GOBIN=$go" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build single in-process DLL with Go c-shared
        shell: msys2 {0}
        run: |
          mkdir -p dist
          export PATH="$(dirname "$(cygpath -u "$ARAY_GOBIN")"):$PATH"
          export CGO_ENABLED=1
          export CC="$(cygpath -w /ucrt64/bin/gcc.exe)"
          "$CC" --version
          go version
          go build -trimpath -tags araydll -buildmode=c-shared -ldflags="-s -w" -o dist/ArayMinimap.dll ./cmd/aray-minimap
          test -s dist/ArayMinimap.dll
          test -s dist/ArayMinimap.h
          echo "DLL Win64 in-process compilada"
      - name: Compile Windows DLL loading smoke test
        shell: msys2 {0}
        run: |
          /ucrt64/bin/gcc.exe -O2 -Wall -Wextra -o dist/eldenring.exe tests/windows_dll_host.c
      - name: Smoke-test LoadLibrary and Go init in native Windows process
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'DllLoadSmoke'
          $game=Join-Path $root 'Game'
          $mods=Join-Path $game 'mods'
          New-Item -ItemType Directory -Path $mods -Force | Out-Null
          Copy-Item dist/eldenring.exe (Join-Path $game 'eldenring.exe')
          Copy-Item dist/ArayMinimap.dll (Join-Path $mods 'ArayMinimap.dll')
          $p=Start-Process -FilePath (Join-Path $game 'eldenring.exe') -WorkingDirectory $game -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "LoadLibrary smoke test failed: exit code $($p.ExitCode)" }
          $log=Join-Path $mods 'ArayMinimap/data/arayminimap.log'
          if (-not (Test-Path -LiteralPath $log)) { throw 'Go DLL startup nao executou: log nao foi criado' }
          $txt=Get-Content -LiteralPath $log -Raw
          Write-Host $txt
          if ($txt -notmatch 'Aray Minimap DLL direta') { throw 'Bootstrap da DLL nao foi executado' }
      - name: Test installation in mock game folder
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'Mock Elden Ring'
          $game=Join-Path $root 'Game'
          New-Item -ItemType Directory -Path (Join-Path $game 'mods') -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $game 'eldenring.exe'),'mock')
          [IO.File]::WriteAllText((Join-Path $game 'dinput8.dll'),'loader sentinel')
          [IO.File]::WriteAllText((Join-Path $game 'mod_loader_config.ini'),'[modloader]`nload_delay=0')
          [IO.File]::WriteAllText((Join-Path $game 'mods/OtherMod.dll'),'other mod')
          ./install.ps1 -GamePath $root -NoPrompt
          if ($LASTEXITCODE -ne 0) {throw 'PowerShell install failed'}
          if (-not (Test-Path (Join-Path $game 'mods/ArayMinimap.dll'))) {throw 'DLL missing'}
          if (Test-Path (Join-Path $game 'mods/ArayMinimap/ArayMinimap.exe')) {throw 'Legacy EXE must not be installed'}
          ./uninstall.ps1 -GamePath $root -NoPrompt
          if ($LASTEXITCODE -ne 0) {throw 'PowerShell uninstall failed'}
          if ((Get-Content (Join-Path $game 'dinput8.dll') -Raw) -ne 'loader sentinel') {throw 'loader modified'}
          if (-not (Test-Path (Join-Path $game 'mods/OtherMod.dll'))) {throw 'third-party mod deleted'}
      - name: Pack native DLL preview
        shell: pwsh
        run: |
          $items=@('dist/ArayMinimap.dll','dist/ArayMinimap.h','install.ps1','install.cmd','uninstall.ps1','uninstall.cmd','README.md','LICENSE','scripts/import_tiles.py')
          Compress-Archive -LiteralPath $items -DestinationPath dist/ArayMinimap-v0.2.0-preview.2-win64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ArayMinimap-native-dll-preview
          path: dist/ArayMinimap-v0.2.0-preview.2-win64.zip
          if-no-files-found: error
          retention-days: 14
